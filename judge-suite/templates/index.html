<!DOCTYPE html>
<html>
<head>
    <title>Consensus Labeling</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .container { max-width: 600px; margin: 60px auto; padding: 40px; background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); text-align: center; }
        h1 { margin-bottom: 30px; color: #333; }
        .buttons { display: flex; gap: 20px; justify-content: center; }
        .btn { padding: 16px 32px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: all 0.2s; text-decoration: none; display: inline-block; }
        .btn-grader_b { background: #3b82f6; color: white; }
        .btn-grader_b:hover { background: #2563eb; }
        .btn-maya { background: #10b981; color: white; }
        .btn-maya:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Consensus Labeling</h1>
        <p style="color: #666; margin-bottom: 40px;">Select your name to start labeling</p>
        <div class="buttons">
            <a href="/label/grader_b" class="btn btn-grader_b">Grader B</a>
            <a href="/label/maya" class="btn btn-maya">Maya</a>
        </div>
    </div>
</body>
</html>
