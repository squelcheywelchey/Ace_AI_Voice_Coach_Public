dimension: quality_conversational_flow

definition: >
  Did the conversation mechanically work as a spoken back-and-forth?
  This dimension scores conversational MECHANICS ONLY — turn-taking,
  recovery from hiccups, and correct firing of the off-topic guardrail.
  Verbosity / feedback length is scored under limits_the_load, NOT here.
  A single minor hiccup that the coach recovers from gracefully does not
  fail the call; the fail line is repeated mechanical breakdown.

pass: >
  Clean turn-taking: the coach asks, waits, and responds to what the
  user actually said. Hiccups (mishearing, garbled audio, an interrupted
  turn) are recovered gracefully — the coach re-asks or clarifies and
  the session moves on. Graceful recovery excuses an ISOLATED hiccup
  (one or two in the whole call), never a repeated pattern. The
  guardrail redirect ("I'm here to help you practice for a job
  interview...") PASSES when it fires at genuinely off-topic input
  (e.g., unrelated chatter, background audio, requests outside
  interview practice).

fail: >
  Repeated mechanical breakdowns. Fail signals include:

  TURN FRAGMENTATION / TALK-OVER: a coach turn that begins while the
  user is still mid-answer, splitting the coach's sentence into stacked
  fragments across the user's continued speech (e.g., AI: "That's great
  because" / User keeps talking / AI: "that's great. Let's move on.").
  Count the exchanges where this happens. If it happens on 3 or more
  separate exchanges, the call FAILS — this is exactly the "repeated
  mechanical breakdown" this dimension exists to catch. Responding
  sensibly afterward and completing all 8 scripted questions does NOT
  redeem repeated talk-over; "the session still progressed" is not
  recovery, it is the failure mode itself.

  Other fail signals: the coach answers its own question without
  waiting; the conversation loops (the same question or feedback
  repeats without progress); duplicated or stacked coach turns; or the
  guardrail MISFIRES on a legitimate on-task request (e.g., the user
  says "Provide an example." or asks for help with the current question
  and gets the off-topic redirect instead). One isolated, recovered
  hiccup is not a fail — look for a repeated pattern or an unrecovered
  breakdown.

na: >
  Not applicable is essentially never correct — conversational flow is
  observable in every session that has any back-and-forth at all.
