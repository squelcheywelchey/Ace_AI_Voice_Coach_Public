dimension: quality_conversational_flow

definition: >
  Did the conversation mechanically work as a spoken back-and-forth?
  This dimension scores conversational MECHANICS ONLY — turn-taking,
  recovery from hiccups, and correct firing of the off-topic guardrail.
  Verbosity / feedback length is scored under limits_the_load, NOT here.
  A single minor hiccup that the coach recovers from gracefully does not
  fail the call; the fail line is repeated mechanical breakdown.

pass: >
  Clean turn-taking: the coach asks, waits, and responds to what the
  user actually said. Hiccups (mishearing, garbled audio, an interrupted
  turn) are recovered gracefully — the coach re-asks or clarifies and
  the session moves on. The guardrail redirect ("I'm here to help you
  practice for a job interview...") PASSES when it fires at genuinely
  off-topic input (e.g., unrelated chatter, background audio, requests
  outside interview practice).

fail: >
  Repeated mechanical breakdowns. Fail signals include: the coach
  interrupts or talks over the user mid-answer; the coach answers its
  own question without waiting; the conversation loops (the same
  question or feedback repeats without progress); duplicated or stacked
  coach turns; or the guardrail MISFIRES on a legitimate on-task request
  (e.g., the user says "Provide an example." or asks for help with the
  current question and gets the off-topic redirect instead). One
  isolated, recovered hiccup is not a fail — look for a repeated pattern
  or an unrecovered breakdown.

na: >
  Not applicable is essentially never correct — conversational flow is
  observable in every session that has any back-and-forth at all.
